
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Watch the Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101014;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(900px, 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      margin-bottom: 18px;
    }

    video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      border-radius: 14px;
      box-shadow: 0 16px 50px #0008;
    }

    #playButton {
      display: none;
      margin: 20px auto;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #101014;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    p {
      color: #b9b9c4;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Watch the Video</h1>

    <video id="myVideo" controls autoplay playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>

    <button id="playButton">▶ Play with Sound</button>

    <p id="message">Loading video...</p>
  </main>

  <script>
    const video = document.getElementById("myVideo");
    const playButton = document.getElementById("playButton");
    const message = document.getElementById("message");

    async function startVideo() {
      try {
        video.muted = false;
        await video.play();

        playButton.style.display = "none";
        message.textContent = "Enjoy watching!";
      } catch (error) {
        playButton.style.display = "block";
        message.textContent =
          "Your browser requires one tap to start the video with sound.";
      }
    }

    window.addEventListener("load", startVideo);

    playButton.addEventListener("click", () => {
      startVideo();
    });

    video.addEventListener("playing", () => {
      playButton.style.display = "none";
      message.textContent = "Enjoy watching!";
    });

    video.addEventListener("error", () => {
      message.textContent = "Video could not load. Please check video.mp4.";
    });
  </script>
</body>
</html>
